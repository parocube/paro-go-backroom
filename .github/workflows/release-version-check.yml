name: Release Version

on:
  pull_request:
    branches:
      - 'release/**'
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Validate next release version
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate branch and VERSION
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version_sentinel='__release_version_end__'
          version_with_sentinel=$(bash .github/scripts/release-version.sh read-version 'HEAD:VERSION')
          case "$version_with_sentinel" in *"$version_sentinel") ;; *) exit 1 ;; esac
          version=${version_with_sentinel%"$version_sentinel"}
          base_version_with_sentinel=$(bash .github/scripts/release-version.sh read-version-or-default "$BASE_SHA:VERSION" 0.0.0)
          case "$base_version_with_sentinel" in *"$version_sentinel") ;; *) exit 1 ;; esac
          base_version=${base_version_with_sentinel%"$version_sentinel"}
          bash .github/scripts/release-version.sh validate-pr "$BASE_REF" "$HEAD_REF" "$version" "$base_version"
