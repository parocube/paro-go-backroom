name: Release candidate
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read

env:
  SOURCE: ${{ github.event.pull_request.head.sha }}
  RELEASE: ${{ github.event.pull_request.head.ref }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  quality:
    if: >-
      github.event.action != 'closed' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    uses: ./.github/workflows/quality.yml
  candidate:
    name: Verify release candidate
    if: >-
      github.event.action != 'closed' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: candidate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.16.0'
      - run: bash .github/scripts/candidate-receipt-test.sh
      - name: Validate release tree and version
        id: source
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$SOURCE^{tree}")"
          version=$(cat VERSION)
          bash .github/scripts/release-version.sh check-tag "$RELEASE" "$version" "$SOURCE" .
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Save candidate identity
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          jq -n --arg source "$SOURCE" --arg pr "$PR_NUMBER" --arg version "$VERSION" \
            '{source:$source,pr:$pr,version:$version}' > "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ env.PR_NUMBER }}-${{ env.SOURCE }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  publish:
    if: >-
      github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.16.0'
      - name: Verify successful candidate for this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e "$SOURCE^{commit}" || git fetch origin "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$SOURCE^{tree}")"
          bash .github/scripts/candidate-receipt.sh
          version=$(cat VERSION)
          jq -e --arg version "$version" '.version == $version' "$RUNNER_TEMP/receipt.json"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tag verified release source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash .github/scripts/release-version.sh create-tag "$RELEASE" "$VERSION" "$SOURCE" origin
